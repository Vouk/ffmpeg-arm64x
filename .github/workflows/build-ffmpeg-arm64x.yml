# =============================================================================
#  ARM64X-FFmpeg-8-Build (LGPL + GPL) -> ZWEI MSI-Installer
#
#  Dieser Workflow baut FFmpeg 8 als ECHTE Single-File-ARM64X-Hybrid-DLLs
#  (je Bibliothek EIN File mit ARM64- UND ARM64EC-Code, KEINE Forwarder) in
#  ZWEI Varianten und erzeugt daraus genau ZWEI MSI-Installer:
#
#    * LGPL : Shared Libraries, OHNE GPL-Encoder, OHNE Hardware-Encoder.
#    * GPL  : zusaetzlich die statisch eingelinkten Encoder x264 + x265.
#
#  KEINE Hardware-Encoder (AMF/NVENC/NVDEC) mehr: ihre Laufzeit-Probes
#  blockieren ARM64EC-Prozesse auf Windows-on-ARM beim Plugin-Init.
#
#  Der Forwarder-Pfad (scripts/merge-arm64x.ps1 + verify-arm64x.ps1) bleibt
#  als Fallback im Repo. Der Workflow laeuft AUSSCHLIESSLICH manuell
#  (workflow_dispatch) auf einem windows-2022-Runner, der ueber die
#  amd64->arm64-Cross-Tools (vcvarsamd64_arm64.bat) nach ARM64 cross-kompiliert
#  und die arm64- sowie die arm64ec-Ansicht per /MACHINE:ARM64X-Link zum Hybrid
#  verschmilzt.
#
#  Je Variante kapselt scripts/build-variant.ps1 die identische Schrittfolge
#  (beide Ansichten bauen -> mergen -> verifizieren -> Faehigkeiten -> MSI),
#  sodass der Workflow sie nur zweimal (lgpl, gpl) aufruft statt den Ablauf
#  zu duplizieren.
#
#  Ein einziger Job, sequenzielle Steps mit Fail-fast. Jeder Step bricht bei
#  erstem Fehler ab (pwsh: $ErrorActionPreference='Stop'); kein Folgeschritt
#  laeuft an und kein Artefakt wird bei Teil-Erfolg hochgeladen.
#
#  Verdrahtet die vorhandenen Bausteine:
#    * Reinlogik-Module : scripts/lib/Version.psm1        (Test-FFmpegMajor8)
#                         scripts/lib/ArtifactCheck.psm1  (Test-MsiCount == 2)
#    * Build-Skripte    : scripts/build-deps.ps1    (x264/x265 static, GPL)
#                         scripts/build-variant.ps1 (ein Variant End-to-End)
#                           -> build-ffmpeg.ps1 (-Arch -Variant
#                              -DepsDir -LinkReproDir)
#                           -> merge-arm64x-merged.ps1
#                           -> verify-arm64x-merged.ps1
#                           -> verify-capabilities.ps1 (-Variant)
#    * Installer        : installer/Product.wxs (candle/light mit
#                         -dVariant=GPL|LGPL, heat harvest des bin-Ordners),
#                         Lizenz-RTF unter installer/license.
# =============================================================================
name: Build FFmpeg 8 (ARM64X, LGPL + GPL)

# -----------------------------------------------------------------------------
#  Trigger: AUSSCHLIESSLICH workflow_dispatch. Es gibt bewusst KEINE
#  push/pull_request/schedule/release-Trigger, damit keine automatischen
#  Laeufe entstehen.
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      ffmpegVersion:
        description: 'FFmpeg-Version (Major-Version MUSS 8 sein), z. B. 8.1.3'
        required: true
        default: '8.1.3'
      productVersion:
        description: 'Anzeigeversion fuer die MSI/Artefaktnamen, z. B. 8.1.3'
        required: true
        default: '8.1.3'

permissions:
  contents: read

env:
  # Zentrale Ausgabe-/Quellpfade fuer den Lauf.
  SRC_DIR: ${{ github.workspace }}\src
  OUT_DIR: ${{ github.workspace }}\out
  DIST_DIR: ${{ github.workspace }}\dist
  # Wurzel der statisch gebauten GPL-Encoder (x264/x265) je ABI.
  DEPS_DIR: ${{ github.workspace }}\out\deps\gpl
  # Kurze Basis fuer die /LINKREPROFULLPATHRSP-Dateien (MAX_PATH-Grenze der
  # rsp-Eintraege). Je Variante ein eigener Unterordner (C:\lr\lgpl, C:\lr\gpl).
  LINKREPRO_BASE: C:\lr

jobs:
  build:
    # =========================================================================
    #  Runner / Toolchain: windows-2022 (x64-Host), der nach ARM64
    #  cross-kompiliert. Genau EINE Toolchain-Umgebung: vcvarsamd64_arm64.bat.
    #  Sie hostet die arm64-Ansicht, die arm64ec-Ansicht UND den
    #  /MACHINE:ARM64X-Hybrid-Link.
    # =========================================================================
    runs-on: windows-2022

    # Sicherheitsnetz: der gesamte Job bricht nach 300 Minuten ab. Zwei volle
    # Merged-Builds (LGPL + GPL) plus x264/x265 je ABI brauchen deutlich mehr
    # Zeit als ein einzelner Variant-Lauf.
    timeout-minutes: 300

    # Fail-fast fuer alle pwsh-Steps: jeder nicht abgefangene Fehler bzw. jeder
    # von Null verschiedene Exit-Code beendet den Step und damit den Lauf.
    defaults:
      run:
        shell: pwsh

    steps:
      # ---------------------------------------------------------------------
      #  1. Checkout: nur dieses Repo, keine externen Referenzen.
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      #  2. Preflight-Konfigurationspruefung:
      #     Vor JEDER Kompilierung pruefen, dass die erforderlichen
      #     Konfigurationsdateien vorhanden sind:
      #       * die Workflow-Definition
      #       * die Installer-Definition (Product.wxs)
      #       * der Variant-Orchestrator (build-variant.ps1)
      #       * die Deps-Build-Logik (build-deps.ps1)
      #       * BEIDE Lizenz-Satzpaare (LGPL + GPL): RTF fuer die Installer-UI
      #         und der jeweilige Lizenz-Volltext.
      #     Fehlt eine, Abbruch mit Benennung der fehlenden Datei -- bevor
      #     irgendetwas gebaut wird.
      # ---------------------------------------------------------------------
      - name: Preflight configuration files
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ github.workspace }}'

          $required = @(
            @{ Kind = 'Workflow-Definition';      Path = '.github/workflows/build-ffmpeg-arm64x.yml' },
            @{ Kind = 'Installer-Definition';     Path = 'installer/Product.wxs' },
            @{ Kind = 'Variant-Orchestrator';     Path = 'scripts/build-variant.ps1' },
            @{ Kind = 'Deps-Build (x264/x265)';   Path = 'scripts/build-deps.ps1' },
            @{ Kind = 'Lizenz-Datei (LGPL RTF)';  Path = 'installer/license/lgpl-3.0.rtf' },
            @{ Kind = 'Lizenz-Datei (LGPL Text)'; Path = 'licenses/LICENSE.LGPL.txt' },
            @{ Kind = 'Lizenz-Datei (GPL RTF)';   Path = 'installer/license/gpl-3.0.rtf' },
            @{ Kind = 'Lizenz-Datei (GPL Text)';  Path = 'licenses/LICENSE.GPL.txt' }
          )

          $missing = @()
          foreach ($item in $required) {
            $full = Join-Path $root $item.Path
            if (-not (Test-Path -LiteralPath $full)) {
              $missing += ("{0}: '{1}'" -f $item.Kind, $item.Path)
            }
          }

          if ($missing.Count -gt 0) {
            # Abbruch VOR jeder Kompilierung mit Benennung der fehlenden Datei.
            $named = $missing -join '; '
            Write-Error "Preflight fehlgeschlagen: fehlende Konfigurationsdatei(en): $named. Der Build wird vor Beginn der Kompilierung abgebrochen."
          }

          Write-Host "Preflight bestanden: alle erforderlichen Konfigurationsdateien (LGPL + GPL) vorhanden."

      # ---------------------------------------------------------------------
      #  3. Toolchain + SDK verifizieren (Design: Runner-/Toolchain-Strategie):
      #     * VS 2022 (v143) mit VC.Tools.ARM64, ueber vswhere auf [17.0,18.0)
      #       gepinnt -> vcvarsamd64_arm64.bat (die EINE Cross-Toolchain).
      #     * Windows-11-SDK adaptiv (Build >= 22000), keine harte Pinnung.
      #     Setzt %VCVARS%, %VCVARS_X64% und %WIN_SDK_VERSION%.
      # ---------------------------------------------------------------------
      - name: Verify ARM64X toolchain + Windows 11 SDK
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe nicht gefunden unter $vswhere -- die Visual-Studio-Installation kann nicht aufgeloest werden."
          }

          # VS 2022 (17.x) mit VC-ARM64-Tools; gepinnt auf [17.0,18.0), damit ein
          # neueres VS auf dem Image nicht still gewaehlt wird (ARM64X-Link bleibt
          # gegen v143 validiert).
          $vsPath = & $vswhere -latest -products * `
            -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          $vsPath = ($vsPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            Write-Error "Keine VS-2022-Installation (17.x) mit VC-ARM64-Toolset (v143) gefunden. Die Suche ist auf [17.0,18.0) gepinnt."
          }
          Write-Host "Visual Studio: $vsPath"

          # Die EINE Toolchain: amd64->arm64-Cross-Tools. Der native arm64-Host-
          # Einstieg (vcvarsarm64) wird bewusst NICHT genutzt.
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsamd64_arm64.bat'
          if (-not (Test-Path $vcvars)) {
            Write-Error "Cross-Toolset-Einstieg nicht gefunden: $vcvars (VC.Tools.ARM64 / v143 amd64_arm64-Cross-Tools fehlen)."
          }

          # Nativer x64-Einstieg fuer die MSI-PATH-Custom-Action-DLL (x64,
          # passend zum x64-Paket; laeuft auf ARM64 per Emulation).
          $vcvarsX64 = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvarsX64)) {
            Write-Error "x64-Toolset-Einstieg nicht gefunden: $vcvarsX64 (VC.Tools.x86.x64 fehlt)."
          }

          # Windows-11-SDK adaptiv waehlen: alle 10.x-SDKs lesen, jene mit
          # Build-Nummer >= 22000 behalten, die hoechste waehlen (ARM64X setzt
          # ein Win11-SDK voraus).
          $sdkBases = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Include",
            "$env:ProgramFiles\Windows Kits\10\Include"
          ) | Where-Object { Test-Path $_ }

          $installed = @()
          foreach ($base in $sdkBases) {
            $installed += Get-ChildItem -LiteralPath $base -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'um') } |
              Select-Object -ExpandProperty Name
          }
          $installed = @($installed | Sort-Object -Unique)

          $win11Sdks = @()
          foreach ($name in $installed) {
            if ($name -match '^\d+\.\d+\.\d+\.\d+$') {
              $v = [version] $name
              if ($v.Build -ge 22000) { $win11Sdks += $v }
            }
          }
          if ($win11Sdks.Count -eq 0) {
            Write-Error "Kein Windows-11-SDK (Build >= 22000) installiert -- ARM64X-Ausgabe setzt eines voraus. Installierte 10.x-SDKs: $($installed -join ', ')."
          }
          $sdkVersion = (@($win11Sdks | Sort-Object -Descending)[0]).ToString()

          "VCVARS=$vcvars"              | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCVARS_X64=$vcvarsX64"       | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN_SDK_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "VCVARS          = $vcvars"
          Write-Host "VCVARS_X64      = $vcvarsX64"
          Write-Host "WIN_SDK_VERSION = $sdkVersion (installierte 10.x-SDKs: $($installed -join ', '))"

      # ---------------------------------------------------------------------
      #  4. MSYS2 einrichten (Design: Runner-/Toolchain-Strategie):
      #     liefert bash/make/pkg-config/nasm/yasm/meson/ninja. Der
      #     MSVC-Compiler kommt aus %VCVARS%; MSYS2 wird mit
      #     MSYS2_PATH_TYPE=inherit gestartet, damit INCLUDE/LIB/PATH
      #     durchgereicht werden. path-type: inherit stellt dies sicher.
      #     cmake/ninja werden zusaetzlich fuer den x265-Build (GPL) gebraucht.
      # ---------------------------------------------------------------------
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            make
            pkgconf
            nasm
            yasm
            diffutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja

      # ---------------------------------------------------------------------
      #  5. FFmpeg-Quelle beziehen + Versionspruefung (R2.1/R2.2):
      #     Die aufgeloeste Version wird ueber Test-FFmpegMajor8 geprueft; ist
      #     die Major-Version nicht 8, Abbruch mit erwarteter (8) und
      #     tatsaechlicher Version. Erst danach wird die Quelle entpackt.
      #
      #     MERGED-ARM64X braucht die Objekte BEIDER Ansichten GLEICHZEITIG,
      #     und BEIDE Varianten (LGPL/GPL) bauen unabhaengig. Da jeder
      #     configure/make-Lauf seinen Quellbaum mit frischen Objekten
      #     ueberschreibt (make distclean), bekommt JEDE (Variante, Ansicht)
      #     einen EIGENEN Quellbaum: vier Baeume insgesamt.
      # ---------------------------------------------------------------------
      - name: Fetch FFmpeg source + verify version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.event.inputs.ffmpegVersion }}'

          # Versionspruefung ueber das Reinlogik-Modul. Wirft bei Major != 8 mit
          # erwarteter (8) und tatsaechlicher Version.
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/Version.psm1') -Force
          $parsed = Test-FFmpegMajor8 -Version $version
          Write-Host "FFmpeg-Version akzeptiert: $($parsed.Major).$($parsed.Minor).$($parsed.Patch) (Major 8)."

          # Quelle beziehen und in $SRC_DIR\ffmpeg entpacken.
          New-Item -ItemType Directory -Force -Path $env:SRC_DIR | Out-Null
          $tarball = Join-Path $env:SRC_DIR "ffmpeg-$version.tar.gz"
          # Bezug vom GitHub-Mirror des FFmpeg-Projekts statt von ffmpeg.org.
          # Release-Tags sind dort mit "n" praefixiert (z. B. n8.0); das
          # Quellarchiv liegt unter archive/refs/tags/n<version>.tar.gz.
          $url = "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$version.tar.gz"
          Write-Host "Lade FFmpeg-Quelle: $url"
          # Download ueber curl.exe (auf dem Runner vorhanden): folgt Redirects,
          # bricht bei haengender Verbindung ueber Timeouts ab und wiederholt
          # transiente Fehler. Invoke-WebRequest wird bewusst NICHT genutzt --
          # sein Fortschrittsbalken drosselt Downloads in nicht-interaktiven
          # CI-Konsolen drastisch (Stunden statt Sekunden).
          & curl.exe --fail --location --show-error --silent `
            --retry 5 --retry-delay 5 --retry-all-errors `
            --connect-timeout 30 --max-time 600 `
            --output $tarball $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Download der FFmpeg-Quelle schlug fehl (curl Exit $LASTEXITCODE): $url" }
          if (-not (Test-Path -LiteralPath $tarball) -or ((Get-Item -LiteralPath $tarball).Length -lt 1MB)) {
            Write-Error "Heruntergeladenes FFmpeg-Archiv fehlt oder ist unplausibel klein: '$tarball'."
          }

          $extractRoot = Join-Path $env:SRC_DIR 'ffmpeg-extract'
          if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xf $tarball -C $extractRoot
          if ($LASTEXITCODE -ne 0) { Write-Error "Entpacken der FFmpeg-Quelle schlug fehl (Exit $LASTEXITCODE)." }

          # Den ausgepackten Quellordner ffmpeg-<version> auf einen stabilen Pfad
          # $SRC_DIR\ffmpeg abbilden (Referenzbaum, aus dem die vier Arbeits-
          # baeume geklont werden).
          $inner = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if ($null -eq $inner) { Write-Error "Kein FFmpeg-Quellordner im entpackten Archiv gefunden." }
          $ffmpegSrc = Join-Path $env:SRC_DIR 'ffmpeg'
          if (Test-Path -LiteralPath $ffmpegSrc) { Remove-Item -LiteralPath $ffmpegSrc -Recurse -Force }
          Move-Item -LiteralPath $inner.FullName -Destination $ffmpegSrc
          if (-not (Test-Path -LiteralPath (Join-Path $ffmpegSrc 'configure'))) {
            Write-Error "Kein 'configure'-Skript im FFmpeg-Quellbaum: '$ffmpegSrc'."
          }

          # Vier Arbeitsbaeume: {lgpl,gpl} x {arm64,arm64ec}. Jeder Baum ist eine
          # frische Kopie des Referenzbaums, damit sich die vier configure/make-
          # Laeufe nicht gegenseitig die Objekte ueberschreiben.
          $trees = @(
            @{ Name = 'FFMPEG_SRC_LGPL_ARM64';   Dir = (Join-Path $env:SRC_DIR 'ffmpeg-lgpl-arm64') },
            @{ Name = 'FFMPEG_SRC_LGPL_ARM64EC'; Dir = (Join-Path $env:SRC_DIR 'ffmpeg-lgpl-arm64ec') },
            @{ Name = 'FFMPEG_SRC_GPL_ARM64';    Dir = (Join-Path $env:SRC_DIR 'ffmpeg-gpl-arm64') },
            @{ Name = 'FFMPEG_SRC_GPL_ARM64EC';  Dir = (Join-Path $env:SRC_DIR 'ffmpeg-gpl-arm64ec') }
          )
          foreach ($t in $trees) {
            if (Test-Path -LiteralPath $t.Dir) { Remove-Item -LiteralPath $t.Dir -Recurse -Force }
            Copy-Item -LiteralPath $ffmpegSrc -Destination $t.Dir -Recurse
            "$($t.Name)=$($t.Dir)" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Quellbaum bereit: $($t.Dir)"
          }

      # ---------------------------------------------------------------------
      #  6. GPL-Encoder-Quellen beziehen (x264 + x265):
      #     NUR fuer die GPL-Variante. x264 von VideoLAN, x265 von Multicoreware
      #     (Branch stable). Beide shallow; die .git-Metadaten werden entfernt,
      #     damit configure/cmake keine VCS-Zustaende einziehen.
      # ---------------------------------------------------------------------
      - name: Fetch GPL encoder sources (x264 + x265)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:SRC_DIR | Out-Null

          $x264Dir = Join-Path $env:SRC_DIR 'x264'
          $x265Dir = Join-Path $env:SRC_DIR 'x265'

          if (-not (Test-Path -LiteralPath $x264Dir)) {
            git clone --depth=1 'https://code.videolan.org/videolan/x264.git' $x264Dir
            if ($LASTEXITCODE -ne 0) { Write-Error "git clone x264 fehlgeschlagen." }
          }
          if (-not (Test-Path -LiteralPath $x265Dir)) {
            git clone --depth=1 --branch stable 'https://bitbucket.org/multicoreware/x265_git.git' $x265Dir
            if ($LASTEXITCODE -ne 0) { Write-Error "git clone x265 fehlgeschlagen." }
          }

          foreach ($d in @($x264Dir, $x265Dir)) {
            $gitMeta = Join-Path $d '.git'
            if (Test-Path -LiteralPath $gitMeta) { Remove-Item -LiteralPath $gitMeta -Recurse -Force }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $x264Dir 'configure'))) {
            Write-Error "x264-Quelle unvollstaendig: kein 'configure' in '$x264Dir'."
          }
          $x265CMake = Join-Path (Join-Path $x265Dir 'source') 'CMakeLists.txt'
          if (-not (Test-Path -LiteralPath $x265CMake)) {
            Write-Error "x265-Quelle unvollstaendig: kein 'source/CMakeLists.txt' in '$x265Dir'."
          }

          "X264_SRC=$x264Dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "X265_SRC=$x265Dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "GPL-Encoder-Quellen bereit: $x264Dir ; $x265Dir"

      # ---------------------------------------------------------------------
      #  9. GPL-Encoder statisch bauen (build-deps.ps1): x264 + x265 je ABI
      #     (arm64 + arm64ec) als statische Archiv-Libs. FFmpeg linkt sie
      #     direkt in avcodec; im Merged-ARM64X-Build landen sie ueber die
      #     /LINKREPROFULLPATHRSP-Capture automatisch im avcodec-Merge. Laeuft
      #     in der %VCVARS%-Cross-Umgebung; x264 via MSYS2-bash, x265 via
      #     cmake/Ninja. Ergebnis-Layout: %DEPS_DIR%\<codec>\<arch>\{include,lib}.
      # ---------------------------------------------------------------------
      - name: Build GPL encoders (x264 + x265, static, arm64 + arm64ec)
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          rem Ninja/cmake aus MSYS2-UCRT64 auf den PATH holen (x265-Build).
          set "PATH=C:\msys64\ucrt64\bin;C:\msys64\usr\bin;%PATH%"
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\build-deps.ps1" ^
            -X264SourceDir "%X264_SRC%" -X265SourceDir "%X265_SRC%" ^
            -OutputDir "%DEPS_DIR%" -Msys2Bash "C:\msys64\usr\bin\bash.exe"
          if errorlevel 1 exit /b 1
          echo ---- x264/x265 Libs ----
          dir /s /b "%DEPS_DIR%\*.lib"

      # ---------------------------------------------------------------------
      # 10. PATH-Custom-Action-DLL bauen (R10): Product.wxs bindet
      #     installer/PathAction/PathAction.dll als Binary ein. Sie wird aus
      #     PathAction.cpp + PathLogic.cpp mit PathAction.def gebaut (x64,
      #     passend zum x64-Paket; laeuft auf ARM64-Windows per Emulation).
      #     EINMAL gebaut, von BEIDEN MSI-Varianten genutzt.
      # ---------------------------------------------------------------------
      - name: Build PATH custom-action DLL
        shell: cmd
        run: |
          call "%VCVARS_X64%"
          if errorlevel 1 exit /b 1
          cd "%GITHUB_WORKSPACE%\installer\PathAction"
          cl /nologo /LD /O2 /EHsc /DUNICODE /D_UNICODE ^
            PathAction.cpp PathLogic.cpp ^
            /Fe:PathAction.dll ^
            /link /DEF:PathAction.def msi.lib advapi32.lib user32.lib
          if errorlevel 1 exit /b 1
          if not exist "PathAction.dll" exit /b 1

      # ---------------------------------------------------------------------
      # 11. WiX-Tools auffinden: heat/candle/light fuer beide MSI-Laeufe. Pfad
      #     an build-variant.ps1 durchreichen (dort kein eigenes Suchen).
      # ---------------------------------------------------------------------
      - name: Locate WiX toolset
        run: |
          $ErrorActionPreference = 'Stop'
          $wixBin = $env:WIX
          if ([string]::IsNullOrWhiteSpace($wixBin)) {
            $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          } else {
            $wixBin = Join-Path $wixBin 'bin'
          }
          foreach ($tool in @('heat.exe','candle.exe','light.exe')) {
            $full = Join-Path $wixBin $tool
            if (-not (Test-Path -LiteralPath $full)) {
              Write-Error "WiX-Werkzeug nicht gefunden: '$full'. WiX Toolset v3.x wird zum Paketieren benoetigt."
            }
          }
          "WIX_BIN=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "WiX-Tools: $wixBin"

      # ---------------------------------------------------------------------
      # 12. LGPL-Variante End-to-End (build-variant.ps1): baut beide Ansichten
      #     (mit Capture), mergt die 7 Kern-DLLs zu Single-File-ARM64X,
      #     verifiziert Header/Hybrid/Export-Paritaet, prueft die Faehigkeiten
      #     (LGPL: KEINE x264/x265, KEINE HW-Encoder) und baut die MSI
      #     ffmpeg-<ver>-lgpl-arm64x.msi. Kein -DepsDir noetig.
      # ---------------------------------------------------------------------
      - name: Build variant LGPL (merged ARM64X + MSI)
        shell: cmd
        run: |
          if not exist "%LINKREPRO_BASE%\lgpl" mkdir "%LINKREPRO_BASE%\lgpl"
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\build-variant.ps1" ^
            -Variant lgpl ^
            -Arm64SourceDir "%FFMPEG_SRC_LGPL_ARM64%" ^
            -Arm64ecSourceDir "%FFMPEG_SRC_LGPL_ARM64EC%" ^
            -OutputDir "%OUT_DIR%\lgpl" ^
            -LinkReproDir "%LINKREPRO_BASE%\lgpl" ^
            -DistDir "%DIST_DIR%" ^
            -ProductVersion "${{ github.event.inputs.productVersion }}" ^
            -InstallerDir "%GITHUB_WORKSPACE%\installer" ^
            -WixBin "%WIX_BIN%"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      # 13. GPL-Variante End-to-End (build-variant.ps1): wie LGPL, zusaetzlich
      #     -DepsDir %DEPS_DIR% (statische x264/x265 je ABI). Faehigkeitspruefung
      #     (GPL: x264/x265 ERFORDERLICH, KEINE HW-Encoder).
      #     Ergebnis: ffmpeg-<ver>-gpl-arm64x.msi.
      # ---------------------------------------------------------------------
      - name: Build variant GPL (merged ARM64X + MSI)
        shell: cmd
        run: |
          if not exist "%LINKREPRO_BASE%\gpl" mkdir "%LINKREPRO_BASE%\gpl"
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\build-variant.ps1" ^
            -Variant gpl ^
            -Arm64SourceDir "%FFMPEG_SRC_GPL_ARM64%" ^
            -Arm64ecSourceDir "%FFMPEG_SRC_GPL_ARM64EC%" ^
            -OutputDir "%OUT_DIR%\gpl" ^
            -LinkReproDir "%LINKREPRO_BASE%\gpl" ^
            -DepsDir "%DEPS_DIR%" ^
            -DistDir "%DIST_DIR%" ^
            -ProductVersion "${{ github.event.inputs.productVersion }}" ^
            -InstallerDir "%GITHUB_WORKSPACE%\installer" ^
            -WixBin "%WIX_BIN%"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      # 14. Artefakt-Zaehlung == 2: genau zwei MSI muessen vorliegen (LGPL +
      #     GPL). Test-MsiCount meldet Erfolg gdw Anzahl == erwartete Anzahl
      #     (2); bei Abweichung Abbruch mit erwarteter und tatsaechlicher Zahl.
      # ---------------------------------------------------------------------
      - name: Assert exactly two MSI installers (LGPL + GPL)
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/ArtifactCheck.psm1') -Force

          $msis = @(Get-ChildItem -LiteralPath $env:DIST_DIR -Filter '*.msi' -File)
          $result = Test-MsiCount -Count $msis.Count
          Write-Host $result.Message
          foreach ($m in $msis) { Write-Host ("  MSI: {0}" -f $m.Name) }

          if (-not $result.Success) {
            Write-Error $result.Message
          }

      # ---------------------------------------------------------------------
      # 15. Upload: beide MSI als Release_Artifact bereitstellen. Laeuft nur,
      #     wenn alle vorherigen Steps ohne Fehler durchliefen; bei Teil-Erfolg
      #     wird nichts hochgeladen (Fail-fast).
      # ---------------------------------------------------------------------
      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-8-arm64x-msi
          path: ${{ github.workspace }}\dist\*.msi
          if-no-files-found: error
          retention-days: 30
