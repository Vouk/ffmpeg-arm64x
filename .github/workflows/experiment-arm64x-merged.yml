# =============================================================================
#  EXPERIMENT: Echte (voll verschmolzene) ARM64X-DLL fuer EINE FFmpeg-Lib
#
#  Zweck: Machbarkeitsnachweis fuer "true merged ARM64X" (OHNE Forwarder) am
#  Beispiel avutil. Baut avutil zweimal (arm64 + arm64ec), sichert je Ansicht
#  die Objekte + .def (merge-arm64x-true.ps1 -Mode Capture) und fuehrt dann
#  EINEN /machine:arm64x-Link durch (-Mode Merge). Danach prueft dumpbin, ob die
#  DLL wirklich beide Ansichten traegt (ARM64X-Header, Hybrid-Loadconfig,
#  Export-Tabelle).
#
#  Diese Pipeline ist ISOLIERT: sie veraendert die produktive
#  build-ffmpeg-arm64x.yml NICHT. Nur manuell ausloesbar.
# =============================================================================
name: EXPERIMENT merged ARM64X (avutil)

on:
  workflow_dispatch:
    inputs:
      ffmpegVersion:
        description: 'FFmpeg-Version (Major MUSS 8 sein)'
        required: true
        default: '8.1.3'

permissions:
  contents: read

env:
  SRC_DIR: ${{ github.workspace }}\src
  OUT_DIR: ${{ github.workspace }}\out
  STAGE_DIR: ${{ github.workspace }}\out\merge-stage
  MERGED_DIR: ${{ github.workspace }}\out\merged

jobs:
  experiment:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain (VS 2022 ARM64 cross-tools)
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          $vsPath = ($vsPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPath)) { Write-Error "Keine VS-2022-ARM64-Toolchain gefunden." }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsamd64_arm64.bat'
          if (-not (Test-Path $vcvars)) { Write-Error "vcvarsamd64_arm64.bat fehlt: $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "VCVARS = $vcvars"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            make
            pkgconf
            nasm
            yasm
            diffutils

      - name: Fetch FFmpeg source + verify version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.event.inputs.ffmpegVersion }}'
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/Version.psm1') -Force
          $parsed = Test-FFmpegMajor8 -Version $version
          Write-Host "FFmpeg $($parsed.Major).$($parsed.Minor).$($parsed.Patch)"
          New-Item -ItemType Directory -Force -Path $env:SRC_DIR | Out-Null
          $tarball = Join-Path $env:SRC_DIR "ffmpeg-$version.tar.gz"
          $url = "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$version.tar.gz"
          & curl.exe --fail --location --show-error --silent --retry 5 --retry-delay 5 `
            --retry-all-errors --connect-timeout 30 --max-time 600 --output $tarball $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Download fehlgeschlagen: $url" }
          $extractRoot = Join-Path $env:SRC_DIR 'ffmpeg-extract'
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xf $tarball -C $extractRoot
          $inner = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          $ffmpegSrc = Join-Path $env:SRC_DIR 'ffmpeg'
          if (Test-Path -LiteralPath $ffmpegSrc) { Remove-Item -LiteralPath $ffmpegSrc -Recurse -Force }
          Move-Item -LiteralPath $inner.FullName -Destination $ffmpegSrc
          "FFMPEG_SRC=$ffmpegSrc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "FFmpeg-Quelle: $ffmpegSrc"

      # Backports anwenden (makedef-Response-Datei etc.) -- dieselben wie
      # produktiv, damit die .def/.objs-Erzeugung identisch ist.
      - name: Apply FFmpeg source backports
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/FFmpegPatch.psm1') -Force
          foreach ($p in (Invoke-FFmpegSourcePatches -SourceDir $env:FFMPEG_SRC)) {
            Write-Host ("[{0}] {1}: {2}" -f $p.File, $p.Name, $p.Status)
          }

      # ---------------------------------------------------------------------
      #  avutil ARM64 bauen, dann Objekte + .def sichern.
      # ---------------------------------------------------------------------
      - name: Build avutil ARM64 + capture
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "MSYS2_PATH_TYPE=inherit"
          bash -lc "cd \"$FFMPEG_SRC\" && make distclean 2>/dev/null; ./configure --toolchain=msvc --target-os=win32 --enable-cross-compile --disable-asm --disable-filter=gfxcapture --enable-shared --disable-static --arch=arm64 && make -j CCDEP= CXXDEP= libavutil/avutil-60.dll"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64 -StageDir "%STAGE_DIR%"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  avutil ARM64EC bauen (frischer Baum), dann Objekte + .def sichern.
      # ---------------------------------------------------------------------
      - name: Build avutil ARM64EC + capture
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "MSYS2_PATH_TYPE=inherit"
          bash -lc "cd \"$FFMPEG_SRC\" && make distclean 2>/dev/null; ./configure --toolchain=msvc --target-os=win32 --enable-cross-compile --disable-asm --disable-filter=gfxcapture --enable-shared --disable-static --arch=arm64 --extra-cflags=-arm64EC --extra-ldflags=-machine:arm64ec && printf '\nCFLAGS += -arm64EC\nLDFLAGS += -machine:arm64ec\n' >> ffbuild/config.mak && make -j CCDEP= CXXDEP= libavutil/avutil-60.dll"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64ec -StageDir "%STAGE_DIR%"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  EIN /machine:arm64x-Link aus beiden Ansichten -> verschmolzene DLL.
      # ---------------------------------------------------------------------
      - name: Merge into a true ARM64X DLL (no forwarder)
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Merge -StageDir "%STAGE_DIR%" -OutputDir "%MERGED_DIR%"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  Verifikation: Header (ARM64X), Hybrid-Loadconfig, Exporte.
      # ---------------------------------------------------------------------
      - name: Verify merged ARM64X DLL
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          echo ===== dumpbin /headers =====
          dumpbin /headers "%MERGED_DIR%\avutil-60.dll" | findstr /i "machine ARM64X ARM64EC"
          echo ===== dumpbin /loadconfig (CHPE / hybrid) =====
          dumpbin /loadconfig "%MERGED_DIR%\avutil-60.dll" | findstr /i "CHPE hybrid ARM64X code map"
          echo ===== dumpbin /exports (head) =====
          dumpbin /exports "%MERGED_DIR%\avutil-60.dll" | findstr /i "av_"
          echo ===== file present? =====
          if not exist "%MERGED_DIR%\avutil-60.dll" exit /b 1
          echo OK

      - name: Upload merged DLL + stage (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-merged-arm64x
          path: |
            ${{ github.workspace }}\out\merged\**
          if-no-files-found: warn
          retention-days: 7
