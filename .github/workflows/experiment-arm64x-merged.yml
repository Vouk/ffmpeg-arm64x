# =============================================================================
#  EXPERIMENT: Echte (voll verschmolzene) ARM64X-DLLs fuer FFmpeg-Libs
#
#  Zweck: Machbarkeitsnachweis fuer "true merged ARM64X" (OHNE Forwarder).
#  Stufe 1 (bestaetigt): avutil.
#  Stufe 2 (dieser Lauf): avcodec -- der harte Fall (viele Objekte, haengt von
#  avutil ab). Testet, ob ein ABHAENGIGER Merge die avutil-Importe gegen die
#  GEMERGTE avutil-Import-Lib aufloest und als ARM64X verifiziert. HW-Encoder
#  (AMF/NVENC/NVDEC) sind hier bewusst weggelassen -- orthogonal zur
#  Merge-Frage und bringen nur pkgconf-Umgebungsthemen ins Spiel.
#
#  Ablauf: avutil + avcodec je zweimal bauen (arm64 + arm64ec), je Ansicht die
#  Objekte + .def sichern. Dann avutil mergen (erzeugt avutil.lib), danach
#  avcodec mergen mit -ExtraLibs <avutil.lib>. dumpbin verifiziert beide.
#
#  ISOLIERT: veraendert die produktive build-ffmpeg-arm64x.yml NICHT.
# =============================================================================
name: EXPERIMENT merged ARM64X (avutil + avcodec)

on:
  workflow_dispatch:
    inputs:
      ffmpegVersion:
        description: 'FFmpeg-Version (Major MUSS 8 sein)'
        required: true
        default: '8.1.3'

permissions:
  contents: read

env:
  SRC_DIR: ${{ github.workspace }}\src
  OUT_DIR: ${{ github.workspace }}\out
  STAGE_DIR: ${{ github.workspace }}\out\merge-stage
  MERGED_DIR: ${{ github.workspace }}\out\merged
  AMF_HEADERS: ${{ github.workspace }}\src\AMF\amf\public\include
  NVCODEC_HEADERS: ${{ github.workspace }}\src\nv-codec-headers\include
  HW_HEADERS: ${{ github.workspace }}\out\hwheaders

jobs:
  experiment:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain (VS 2022 ARM64 cross-tools)
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          $vsPath = ($vsPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vsPath)) { Write-Error "Keine VS-2022-ARM64-Toolchain gefunden." }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsamd64_arm64.bat'
          if (-not (Test-Path $vcvars)) { Write-Error "vcvarsamd64_arm64.bat fehlt: $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "VCVARS = $vcvars"

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            make
            pkgconf
            nasm
            yasm
            diffutils

      - name: Fetch FFmpeg source + verify version
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.event.inputs.ffmpegVersion }}'
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/Version.psm1') -Force
          $parsed = Test-FFmpegMajor8 -Version $version
          Write-Host "FFmpeg $($parsed.Major).$($parsed.Minor).$($parsed.Patch)"
          New-Item -ItemType Directory -Force -Path $env:SRC_DIR | Out-Null
          $tarball = Join-Path $env:SRC_DIR "ffmpeg-$version.tar.gz"
          $url = "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n$version.tar.gz"
          & curl.exe --fail --location --show-error --silent --retry 5 --retry-delay 5 `
            --retry-all-errors --connect-timeout 30 --max-time 600 --output $tarball $url
          if ($LASTEXITCODE -ne 0) { Write-Error "Download fehlgeschlagen: $url" }
          $extractRoot = Join-Path $env:SRC_DIR 'ffmpeg-extract'
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xf $tarball -C $extractRoot
          $inner = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          $ffmpegSrc = Join-Path $env:SRC_DIR 'ffmpeg'
          if (Test-Path -LiteralPath $ffmpegSrc) { Remove-Item -LiteralPath $ffmpegSrc -Recurse -Force }
          Move-Item -LiteralPath $inner.FullName -Destination $ffmpegSrc
          "FFMPEG_SRC=$ffmpegSrc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "FFmpeg-Quelle: $ffmpegSrc"

      # HINWEIS: Die Hardware-Encoder (AMF/NVENC/NVDEC) sind fuer DIESEN
      # Machbarkeitstest BEWUSST WEGGELASSEN. Die Frage von Stufe 2 ist allein,
      # ob ein ABHAENGIGER Merge (avcodec -> avutil) funktioniert; die
      # avutil-Abhaengigkeit besteht unabhaengig von HW-Encodern. HW-Encoder
      # wuerden nur die (orthogonale) pkgconf/ffnvcodec-Umgebung ins Spiel
      # bringen, die die produktive Pipeline bereits loest.
      - name: Apply FFmpeg source backports
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path '${{ github.workspace }}' 'scripts/lib/FFmpegPatch.psm1') -Force
          foreach ($p in (Invoke-FFmpegSourcePatches -SourceDir $env:FFMPEG_SRC)) {
            Write-Host ("[{0}] {1}: {2}" -f $p.File, $p.Name, $p.Status)
          }

      # ---------------------------------------------------------------------
      #  ARM64: avutil + avcodec bauen, dann beide Libs capturen.
      #  Hinweis: 'make libavcodec/avcodec-62.dll' baut avutil transitiv mit.
      # ---------------------------------------------------------------------
      - name: Build avutil + avcodec ARM64 + capture
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "MSYS2_PATH_TYPE=inherit"
          bash -lc "cd \"$FFMPEG_SRC\" && make distclean 2>/dev/null; ./configure --toolchain=msvc --target-os=win32 --enable-cross-compile --disable-asm --disable-filter=gfxcapture --enable-shared --disable-static --arch=arm64 || (echo '==== config.log tail ===='; tail -40 ffbuild/config.log; exit 1)"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\patch-keep-objs.ps1" -SourceDir "%FFMPEG_SRC%"
          if errorlevel 1 exit /b 1
          call "%VCVARS%"
          bash -lc "cd \"$FFMPEG_SRC\" && make -j CCDEP= CXXDEP= libavutil/avutil-60.dll libavcodec/avcodec-62.dll && echo '--- .objs.keep vorhanden? ---' && ls -la libavutil/*.objs.keep libavcodec/*.objs.keep 2>/dev/null || true"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64 -StageDir "%STAGE_DIR%" -LibBase avutil-60 -RequireObjsFile
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64 -StageDir "%STAGE_DIR%" -LibBase avcodec-62 -RequireObjsFile
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  ARM64EC: dito (frischer Baum).
      # ---------------------------------------------------------------------
      - name: Build avutil + avcodec ARM64EC + capture
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "MSYS2_PATH_TYPE=inherit"
          bash -lc "cd \"$FFMPEG_SRC\" && make distclean 2>/dev/null; ./configure --toolchain=msvc --target-os=win32 --enable-cross-compile --disable-asm --disable-filter=gfxcapture --enable-shared --disable-static --arch=arm64 --extra-cflags=-arm64EC --extra-ldflags=-machine:arm64ec && printf '\nCFLAGS += -arm64EC\nLDFLAGS += -machine:arm64ec\n' >> ffbuild/config.mak || (echo '==== config.log tail ===='; tail -40 ffbuild/config.log; exit 1)"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\patch-keep-objs.ps1" -SourceDir "%FFMPEG_SRC%"
          if errorlevel 1 exit /b 1
          call "%VCVARS%"
          bash -lc "cd \"$FFMPEG_SRC\" && make -j CCDEP= CXXDEP= libavutil/avutil-60.dll libavcodec/avcodec-62.dll && echo '--- .objs.keep vorhanden? ---' && ls -la libavutil/*.objs.keep libavcodec/*.objs.keep 2>/dev/null || true"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64ec -StageDir "%STAGE_DIR%" -LibBase avutil-60 -RequireObjsFile
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Capture -SourceDir "%FFMPEG_SRC%" -Arch arm64ec -StageDir "%STAGE_DIR%" -LibBase avcodec-62 -RequireObjsFile
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  Merge avutil zuerst (erzeugt avutil-60.dll + avutil.lib), dann avcodec
      #  mit -ExtraLibs <avutil.lib> (loest die avutil-Importe auf).
      # ---------------------------------------------------------------------
      - name: Merge avutil, then avcodec (true ARM64X)
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Merge -StageDir "%STAGE_DIR%" -OutputDir "%MERGED_DIR%" -LibBase avutil-60
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\scripts\experimental\merge-arm64x-true.ps1" ^
            -Mode Merge -StageDir "%STAGE_DIR%" -OutputDir "%MERGED_DIR%" -LibBase avcodec-62 -ExtraLibs "%MERGED_DIR%\avutil.lib"
          if errorlevel 1 exit /b 1

      # ---------------------------------------------------------------------
      #  Verifikation beider DLLs: Header (ARM64X), Hybrid-Loadconfig, Exporte.
      # ---------------------------------------------------------------------
      - name: Verify merged ARM64X DLLs
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          for %%D in (avutil-60 avcodec-62) do (
            echo ===== %%D.dll : headers =====
            dumpbin /headers "%MERGED_DIR%\%%D.dll" | findstr /i "machine ARM64X ARM64EC"
            echo ===== %%D.dll : loadconfig =====
            dumpbin /loadconfig "%MERGED_DIR%\%%D.dll" | findstr /i "hybrid ARM64X dispatch"
            if not exist "%MERGED_DIR%\%%D.dll" exit /b 1
          )
          echo ===== avcodec exports (sample) =====
          dumpbin /exports "%MERGED_DIR%\avcodec-62.dll" | findstr /i "avcodec_"
          echo OK

      - name: Upload merged DLLs (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-merged-arm64x
          path: |
            ${{ github.workspace }}\out\merged\**
          if-no-files-found: warn
          retention-days: 7
